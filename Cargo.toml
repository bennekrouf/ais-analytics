[package]
name = "ais-analytics"
version = "0.1.12"
edition = "2024"
license-file = "LICENSE"

[dependencies]
arboard = "3"
azure_core = "1.1.0"
azure_identity = "1.0.0"
chrono = "0.4.42"
dark-light = "2.0.0"
dioxus = { version = "0.7.10", features = ["desktop"] }
dirs = "6.0.0"
futures = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Skipped on non-Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
