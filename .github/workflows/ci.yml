name: CI

# Fast feedback on every branch and PR.
#
# release.yml is the heavy pipeline: it only runs on `v*` tags and takes ~15
# minutes to produce signed macOS/Windows/Linux artifacts. This workflow exists
# so that a regression `cargo test` can already see never costs you that round
# trip plus a download and a manual click-through.
on:
  pull_request:
  push:
    branches: [master]

# A newer push on the same ref cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting: advisory ───────────────────────────────────────────────────
  # No toolchain deps and no compile, so this reports in ~20s. Non-blocking on
  # purpose: the tree is not currently rustfmt-clean, and a gate that is red
  # from day one is a gate you learn to ignore. Do a one-time
  # `cargo fmt --all` commit, then delete the continue-on-error line below.
  fmt:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  # ── Tests: blocking ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keys off Cargo.lock *and* prunes the target dir between runs, which
      # plain actions/cache does not — worth it for a workflow this frequent.
      - uses: Swatinem/rust-cache@v2

      # The same GTK/WebKit stack build-linux installs in release.yml: Dioxus
      # desktop links it even when all you are doing is running unit tests.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config

      # --locked fails the run if Cargo.lock has drifted from Cargo.toml,
      # which today only surfaces during the release build.
      - name: Test
        run: cargo test --workspace --locked

      # Advisory, and deliberately last: the target dir is warm from the test
      # build, so this costs a fraction of a standalone clippy job. Drop the
      # continue-on-error and add `-- -D warnings` once the existing warnings
      # are cleared (most are `cargo clippy --fix` one-liners).
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
